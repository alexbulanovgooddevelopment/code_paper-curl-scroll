<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Paper Curl Scroll — изображение, которое при прокрутке отгибается как лист бумаги, на Three.js, GSAP и Lenis."
    />
    <title>Paper Curl Scroll</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
      }
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/lenis@1.3.17/dist/lenis.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"
      defer
    ></script>
    <script src="script.js" type="module"></script>
  </head>
  <body>
    <main>
      <section class="hero">
        <!-- Картинка задаёт размер холста и видна, если WebGL недоступен -->
        <div class="hero-image-container">
          <img
            class="hero-image"
            src="images/image-01.jpg"
            alt=""
            width="1024"
            height="1536"
          />
        </div>

        <div class="hero-text">
          <h1>
            Самое ценное не всегда лежит на поверхности. Иногда нужно просто
            подойти ближе.
          </h1>
        </div>
      </section>
    </main>
  </body>
</html>
